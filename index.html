<script>
const $=id=>document.getElementById(id), model=$('model'), prompt=$('prompt'), feedback=$('feedback'), left=$('leftAction'), right=$('rightAction'), choices=[$('choice0'),$('choice1')];
const questions=[
 {name:"だるま",wrong:"こけし",src:'voxel-daruma.glb',azimuth:180,polar:75},
 {name:"まねきねこ",wrong:"うさぎ",src:'voxel-manekineko.glb',azimuth:180,polar:75},
 {name:"にんじゃ",wrong:"さむらい",src:'voxel-ninja.glb',azimuth:180,polar:75},
 {name:"たいやき",wrong:"さかな",src:'voxel-taiyaki.glb',azimuth:90,polar:75,finishAzimuth:180},
 {name:"おにぎり",wrong:"おもち",src:'voxel-onigiri.glb',azimuth:90,polar:75},
 {name:"せんす",wrong:"うちわ",src:'voxel-fan.glb',azimuth:90,polar:75},
 {name:"ポスト",wrong:"でんわ",src:'voxel-postbox.glb',azimuth:0,polar:75},
 {name:"ちょうちん",wrong:"でんきゅう",src:'voxel-lantern.glb',azimuth:0,polar:75},
 {name:"とうろう",wrong:"おしろ",src:'voxel-stonelantern.glb',azimuth:180,polar:20},
 {name:"ぼんさい",wrong:"はちうえ",src:'voxel-bonsai.glb',azimuth:0,polar:75},
 {name:"たけ",wrong:"きゅうり",src:'voxel-bamboo.glb',azimuth:90,polar:75},
 {name:"さくら",wrong:"うめ",src:'voxel-sakura.glb',azimuth:180,polar:160},
 {name:"だんご",wrong:"あめ",src:'voxel-dango.glb',azimuth:90,polar:75},
 {name:"おべんとう",wrong:"ゲームき",src:'voxel-bento.glb',azimuth:0,polar:75},
 {name:"おすもうさん",wrong:"にんじゃ",src:'voxel-sumo.glb',azimuth:0,polar:75},
 {name:"こけし",wrong:"だるま",src:'voxel-kokeshi.glb',azimuth:0,polar:75},
 {name:"さむらい",wrong:"にんじゃ",src:'voxel-samurai.glb',azimuth:90,polar:75},
 {name:"げいしゃ",wrong:"こけし",src:'voxel-geisha.glb',azimuth:180,polar:75},
 {name:"あさひ",wrong:"おはな",src:'voxel-risingsun.glb',azimuth:90,polar:75},
 {name:"ふじさん",wrong:"ゆきやま",src:'voxel-fuji.glb',azimuth:180,polar:15},
 {name:"スカイツリー",wrong:"とうきょうタワー",src:'voxel-skytree.glb',azimuth:180,polar:15},
 {name:"とうきょうタワー",wrong:"スカイツリー",src:'voxel-tokyotower.glb',azimuth:180,polar:15},
 {name:"おしろ",wrong:"おてら",src:'voxel-castle.glb',azimuth:0,polar:75},

 {name:"とりい",wrong:"もん",src:'voxel-torii.glb',azimuth:0,polar:75}
];
const builtInAngles={"voxel-daruma.glb":{"azimuth":180.0,"polar":75.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-manekineko.glb":{"azimuth":180.0,"polar":75.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-ninja.glb":{"azimuth":226.5,"polar":28.7,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-taiyaki.glb":{"azimuth":90.0,"polar":75.0,"finishAzimuth":180.0,"finishPolar":75.0},"voxel-onigiri.glb":{"azimuth":90.0,"polar":75.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-fan.glb":{"azimuth":90.0,"polar":75.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-postbox.glb":{"azimuth":2.3,"polar":15.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-lantern.glb":{"azimuth":-42.7,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-stonelantern.glb":{"azimuth":180.0,"polar":15.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-bonsai.glb":{"azimuth":3.0,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-bamboo.glb":{"azimuth":90.0,"polar":75.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-sakura.glb":{"azimuth":148.0,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-dango.glb":{"azimuth":90.8,"polar":46.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-bento.glb":{"azimuth":-8.4,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-sumo.glb":{"azimuth":-87.6,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-kokeshi.glb":{"azimuth":-73.9,"polar":15.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-samurai.glb":{"azimuth":179.2,"polar":15.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-geisha.glb":{"azimuth":180.0,"polar":15.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-risingsun.glb":{"azimuth":90.0,"polar":75.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-fuji.glb":{"azimuth":180.0,"polar":15.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-skytree.glb":{"azimuth":173.9,"polar":15.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-tokyotower.glb":{"azimuth":167.0,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-castle.glb":{"azimuth":-17.5,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-pagoda.glb":{"azimuth":-33.5,"polar":165.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-flagjp.glb":{"azimuth":90.0,"polar":75.0,"finishAzimuth":0.0,"finishPolar":75.0},"voxel-torii.glb":{"azimuth":-87.6,"polar":15.8,"finishAzimuth":0.0,"finishPolar":75.0}};
const adjusting=new URLSearchParams(location.search).get('adjust')==='1';
const storageKey='kurukuru-japan-angle-config-v1';
let storedAngles={};try{storedAngles=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
for(const q of questions){if(builtInAngles[q.src])Object.assign(q,builtInAngles[q.src]);if(adjusting && storedAngles[q.src])Object.assign(q,storedAngles[q.src]);}
let selectedCourse=5;
let order=[],questionIndex=0,phase='observe',answerIndex=0,animationId=0,feedbackTimer=0,loadToken=0;
const current=()=>questions[order[questionIndex]];
function shuffle(list){const arr=[...list];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function stopSpin(){if(animationId){cancelAnimationFrame(animationId);animationId=0;}}
function resetCamera(){stopSpin();model.autoRotate=false;const q=current();model.cameraOrbit=`${q.azimuth}deg ${q.polar}deg auto`;if(typeof model.jumpCameraToGoal==='function')model.jumpCameraToGoal();}
function spinOnce(fromFront=false){
 stopSpin();const q=current();const orbit=model.getCameraOrbit?.();let a0=orbit?orbit.theta*180/Math.PI:q.azimuth;let p0=orbit?orbit.phi*180/Math.PI:q.polar;
 // 再回転では、指で動かしていた向きに左右されないよう、正解が見える角度にそろえる。
 if(fromFront){a0=q.finishAzimuth??0;p0=q.finishPolar??75;model.cameraOrbit=`${a0}deg ${p0}deg auto`;if(typeof model.jumpCameraToGoal==='function')model.jumpCameraToGoal();}
 // モデルごとに停止角度を指定。各モデルの向きはiPhoneで後から調整可能。
 const target=q.finishAzimuth??0, targetPolar=q.finishPolar??75;
 const mod=((a0%360)+360)%360;
 const toFront=((target-mod)%360+360)%360;
 const degrees=fromFront?360:360+toFront,start=performance.now(),duration=2600;
 const frame=now=>{const t=Math.min(1,(now-start)/duration),smooth=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
 model.cameraOrbit=`${a0+degrees*smooth}deg ${p0+(targetPolar-p0)*smooth}deg auto`;
 if(t<1)animationId=requestAnimationFrame(frame);else{animationId=0;model.cameraOrbit=`${a0+degrees}deg ${targetPolar}deg auto`;}};
 animationId=requestAnimationFrame(frame);
}
function setAction(el,label,handler,show=true){el.textContent=label;el.hidden=!show;el.onclick=show?handler:null;el.setAttribute('aria-label',label);}
function clearFeedback(){clearTimeout(feedbackTimer);feedback.className='feedback';feedback.textContent='';}
function render(){
 const q=current();
 choices.forEach(el=>{el.hidden=!['choose','correct','wrong'].includes(phase);el.disabled=phase!=='choose';el.classList.remove('selected','correct','incorrect');});
 if(phase==='observe'){
  prompt.textContent=`${questionIndex+1} / ${order.length}　くるっと 回してみよう！`;
  setAction(left,'こたえる',()=>{phase='choose';render()});setAction(right,'むきをもどす',resetCamera);
 }else if(phase==='choose'){
  prompt.textContent=`${questionIndex+1} / ${order.length}　どちらかな？`;
  setAction(left,'かんさつ',()=>{phase='observe';render()});setAction(right,'むきをもどす',resetCamera);
  choices.forEach((el,i)=>{el.textContent=i===answerIndex?q.name:q.wrong;el.onclick=()=>judge(i);}); requestAnimationFrame(fitChoices);
 }else if(phase==='correct'){
  prompt.textContent=`${questionIndex+1} / ${order.length}　${q.name}！`;
  setAction(left,questionIndex===order.length-1?'けっかをみる':'つぎへ',nextQuestion);
  setAction(right,'もういっかい回す',()=>spinOnce(true));requestAnimationFrame(fitActions);
 }else if(phase==='wrong'){
  prompt.textContent='よく見てみよう！';
  setAction(left,'もういちど',()=>{clearFeedback();phase='observe';render()});setAction(right,'むきをもどす',resetCamera);
 }
 requestAnimationFrame(fitActions);
}
function fitActions(){
 const stageWidth=document.querySelector('.stage').getBoundingClientRect().width;
 const base=Math.min(27,Math.max(14,stageWidth*0.048));
 [left,right].forEach(el=>{
  if(el.hidden)return;
  let size=base;el.style.fontSize=size+'px';
  while(size>10 && el.scrollWidth>el.clientWidth+1){size-=0.5;el.style.fontSize=size+'px';}
 });
}
function fitChoices(){
 // 長い日本語も2択の枠からはみ出さないように、各ボタンを個別に調整。
 // PowerPointの背景枠は変更しない。
 const stageWidth=document.querySelector('.stage').getBoundingClientRect().width;
 const base=Math.min(32,Math.max(17,stageWidth*0.052));
 choices.forEach(el=>{
  if(el.hidden)return;
  let size=base;
  el.style.fontSize=size+'px';
  while(size>10 && el.scrollWidth>el.clientWidth+1){size-=0.5;el.style.fontSize=size+'px';}
 });
}
window.addEventListener('resize',()=>requestAnimationFrame(()=>{fitChoices();fitActions()}));
document.fonts?.ready.then(()=>requestAnimationFrame(()=>{fitChoices();fitActions()}));
function judge(i){
 if(phase!=='choose')return;
 const good=i===answerIndex;phase=good?'correct':'wrong';render();
 choices[i].classList.add('selected',good?'correct':'incorrect');choices.forEach(el=>el.disabled=true);
 feedback.textContent=good?'○ せいかい！':'× ざんねん！';feedback.className='feedback show '+(good?'good':'bad');
 clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>feedback.className='feedback',3000);
 if(good)spinOnce();
}
function loadQuestion(){
 clearFeedback();stopSpin();answerIndex=Math.random()<.5?0:1;phase='observe';
 const q=current();model.setAttribute('src','./'+q.src);resetCamera();render();
 const token=++loadToken;
 model.addEventListener('load',()=>{if(token===loadToken)resetCamera();},{once:true});
}
function nextQuestion(){if(questionIndex===order.length-1){stopSpin();clearFeedback();$('score').textContent=`${order.length} / ${order.length} もん`; $('result').classList.add('open');return;}questionIndex++;loadQuestion();}
function newGame(){order=shuffle(questions.map((_,i)=>i)).slice(0,selectedCourse);questionIndex=0;$('result').classList.remove('open');$('course').classList.remove('open');loadQuestion();}
function chooseCourse(n){selectedCourse=n;newGame();}
$('playAgain').onclick=()=>{$('result').classList.remove('open');$('course').classList.add('open');};
document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>chooseCourse(Number(b.dataset.course)));
let infoReturnFocus=null; const openAbout=()=>{infoReturnFocus=document.activeElement;$('overlay').classList.add('open');$('closeInfo').focus()}; $('info').onclick=openAbout; $('courseInfo').onclick=openAbout;
$('closeInfo').onclick=()=>{$('overlay').classList.remove('open');(infoReturnFocus&&typeof infoReturnFocus.focus==='function'?infoReturnFocus:$('info')).focus()};
const fonts={mochiy:"'Mochiy Pop One',sans-serif",dot:"'DotGothic16',sans-serif",maru:"'Zen Maru Gothic',sans-serif"};
document.querySelectorAll('[data-font]').forEach(btn=>btn.onclick=()=>{
 document.querySelector('.stage').style.setProperty('--game-font',fonts[btn.dataset.font]);
 document.querySelectorAll('[data-font]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
});
model.addEventListener('error',()=>{prompt.textContent='3Dを読み込めませんでした。ファイル名を確認してください。'});
$('course').classList.add('open');
if(adjusting){
 document.querySelector('.stage').classList.add('adjustMode');
 $('course').classList.remove('open');
 const sel=$('adjustItem'),status=$('adjustStatus');
 questions.forEach((q,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=(i+1)+'. '+q.name;sel.appendChild(opt)});
 const showSelected=()=>{const i=Number(sel.value),q=questions[i];order=[i];questionIndex=0;phase='observe';stopSpin();model.src='./'+q.src;prompt.textContent=q.name+'：回して角度を決めよう';model.addEventListener('load',()=>resetCamera(),{once:true});resetCamera();status.textContent=q.name+' の角度を調整中';};
 sel.addEventListener('change',showSelected);
 const getAngles=()=>{const o=model.getCameraOrbit();return {azimuth:Math.round(o.theta*180/Math.PI*10)/10,polar:Math.round(o.phi*180/Math.PI*10)/10}};
 const saveAngle=where=>{const q=questions[Number(sel.value)],o=getAngles();if(where==='start'){q.azimuth=o.azimuth;q.polar=o.polar;}else{q.finishAzimuth=o.azimuth;q.finishPolar=o.polar;}
 storedAngles[q.src]={azimuth:q.azimuth,polar:q.polar,finishAzimuth:q.finishAzimuth??0,finishPolar:q.finishPolar??75};try{localStorage.setItem(storageKey,JSON.stringify(storedAngles))}catch(e){}
 status.textContent=q.name+'：'+(where==='start'?'開始':'正解後')+'角度を保存しました（'+o.azimuth+'°, '+o.polar+'°）';$('angleData').value=JSON.stringify(storedAngles,null,2);};
 $('saveStart').onclick=()=>saveAngle('start');$('saveEnd').onclick=()=>saveAngle('end');
 $('previewStart').onclick=()=>resetCamera();
 $('previewEnd').onclick=()=>{const q=questions[Number(sel.value)];model.cameraOrbit=`${q.finishAzimuth??0}deg ${q.finishPolar??75}deg auto`;model.jumpCameraToGoal?.();};
 $('exportAngles').onclick=async()=>{const data=JSON.stringify(storedAngles,null,2);$('angleData').value=data;try{await navigator.clipboard.writeText(data);status.textContent='角度の設定をコピーしました。チャットに貼り付けてください。'}catch(e){$('angleData').focus();$('angleData').select();status.textContent='下のデータをコピーしてチャットへ貼り付けてください。'}};
 showSelected();
}

// Keep 3D gestures within the Web app instead of scrolling the underlying page.
// Facebook's own edge-swipe navigation may still override this.
const gestureStage = document.querySelector('.stage');
const gestureViewer = document.querySelector('.viewer');
if (gestureViewer) {
  gestureViewer.addEventListener('touchmove', event => {
    if (event.cancelable) event.preventDefault();
  }, {passive:false});
}
// Prevent overscroll of the fixed screen, without blocking normal button taps.
if (gestureStage) {
  gestureStage.addEventListener('touchmove', event => {
    if (event.cancelable && !event.target.closest('.adjustPanel, .infoPanel')) {
      event.preventDefault();
    }
  }, {passive:false});
}
</script></body></html>
